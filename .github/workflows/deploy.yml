name: Deploy tested image to configured Kubernetes cluster

# Optional: configure the staging GitHub Environment and KUBE_CONFIG_B64 secret first.
# No cloud account, cluster, or paid resources are created by this workflow.
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full tested commit SHA whose sha- image is already in GHCR
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_SHA: ${{ inputs.commit_sha }}
      DEPLOY_IMAGE: ghcr.io/${{ github.repository }}
      KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.32.3
      - uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: 5.6.0
      - name: Prepare cluster credentials and release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'A full lowercase commit SHA is required'; exit 1; }
          test -n "$KUBE_CONFIG_B64" || { echo 'Configure staging KUBE_CONFIG_B64 first'; exit 1; }
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
          cd infrastructure/kubernetes/base
          kustomize edit set image "feedback-ai=$DEPLOY_IMAGE:sha-$DEPLOY_SHA"
      - name: Require provisioned secrets and apply release
        run: |
          kubectl -n feedback-ai get secret feedback-secrets >/dev/null
          kubectl -n feedback-ai delete job feedback-migrate feedback-kafka-init --ignore-not-found
          kubectl apply -k infrastructure/kubernetes/base
          kubectl -n feedback-ai wait --for=condition=complete job/feedback-migrate job/feedback-kafka-init --timeout=300s
          for service in ingestion inference worker outbox rag; do
            kubectl -n feedback-ai rollout status "deployment/$service" --timeout=180s
          done
      - name: Report rollout failure
        if: failure()
        run: |
          kubectl -n feedback-ai get pods
          kubectl -n feedback-ai get events --sort-by=.lastTimestamp
          echo 'Inspect the failed rollout. Roll back the affected deployment with kubectl rollout undo; database migrations are forward-only.'
      - name: Remove temporary cluster credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig"
