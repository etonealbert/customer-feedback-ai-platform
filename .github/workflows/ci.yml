name: Test, validate, and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Lint and unit tests
        run: |
          uv run ruff check .
          uv run pytest tests/unit -q
      - name: Create ephemeral local configuration
        run: uv run python scripts/setup_env.py
      - name: Validate Compose
        run: docker compose config --quiet
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.32.3
      - name: Validate Kubernetes schemas
        run: |
          kubectl kustomize infrastructure/kubernetes/base > /tmp/feedback-kubernetes.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -kubernetes-version 1.32.0 < /tmp/feedback-kubernetes.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -kubernetes-version 1.32.0 < infrastructure/kubernetes/optional/autoscaling.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -kubernetes-version 1.32.0 < infrastructure/kubernetes/monitoring/monitoring.yaml
      - name: Start real PostgreSQL, Kafka, and application services
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Integration tests
        run: uv run pytest tests/integration -m integration -q
      - name: Capture logs
        if: always()
        run: |
          mkdir -p test-artifacts
          docker compose ps -a > test-artifacts/compose-status.txt
          docker compose logs --no-color > test-artifacts/compose.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-logs
          path: test-artifacts/
          retention-days: 7
      - name: Stop ephemeral stack
        if: always()
        run: docker compose down --volumes

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Authenticate to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
