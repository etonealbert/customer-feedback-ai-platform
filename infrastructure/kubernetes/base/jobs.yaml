apiVersion: batch/v1
kind: Job
metadata:
  name: feedback-migrate
spec:
  backoffLimit: 12
  template:
    spec:
      restartPolicy: OnFailure
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001}
      containers:
        - name: migrate
          image: feedback-ai:local
          imagePullPolicy: IfNotPresent
          command: [python, -m, feedback_platform.bootstrap]
          envFrom:
            - configMapRef: {name: feedback-config}
            - secretRef: {name: feedback-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: feedback-kafka-init
spec:
  backoffLimit: 12
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topics
          image: apache/kafka:3.9.1
          command: [/bin/sh, -ec]
          args:
            - |
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic feedback.v1 --partitions 6 --replication-factor 1 --config retention.ms=604800000
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic feedback.dlq.v1 --partitions 6 --replication-factor 1 --config retention.ms=2592000000
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
