apiVersion: v1
kind: Service
metadata:
  name: ingestion
spec:
  selector: {app: ingestion}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  labels: {app: ingestion}
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: ingestion}
  template:
    metadata:
      labels: {app: ingestion}
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8000'
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ingestion
          image: feedback-ai:local
          imagePullPolicy: IfNotPresent
          command: [uvicorn, feedback_platform.ingestion:app, --host, 0.0.0.0, --port, "8000"]
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: feedback-config}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: feedback-secrets, key: DATABASE_URL}
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef: {name: feedback-secrets, key: INTERNAL_API_KEY}

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 384Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
---
