# Merge this job into a cluster Prometheus with pod-discovery RBAC.
# This avoids load-balancing counter scrapes across replicas.
scrape_configs:
  - job_name: feedback-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [feedback-ai]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        action: keep
        regex: http
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: service
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
