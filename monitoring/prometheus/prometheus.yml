global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: feedback-services
    static_configs:
      - targets: [ingestion:8000]
        labels: {service: ingestion}
      - targets: [inference:8000]
        labels: {service: inference}
      - targets: [rag:8000]
        labels: {service: rag}
      - targets: [outbox:8000]
        labels: {service: outbox}
      - targets: [worker:8000]
        labels: {service: worker}
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
