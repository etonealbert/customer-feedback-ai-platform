global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: feedback-services
    dns_sd_configs:
      - names: [ingestion, inference, rag, outbox, worker]
        type: A
        port: 8000
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
